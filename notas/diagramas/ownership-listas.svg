<text x="405" y="77" font-size="13" text-anchor="middle" fill="#111827" font-weight="600" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">nodo 1</text>
<rect x="510" y="52" width="90" height="40" rx="6" fill="#eef2ff" stroke="#1240e0" stroke-width="1.5"/>
