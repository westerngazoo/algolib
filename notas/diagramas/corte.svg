<text x="380" y="288" font-size="13" text-anchor="middle" fill="#111827" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">T′ = T − e′ + e   y   w(e) ≤ w(e′)  ⇒  w(T′) ≤ w(T)</text>
