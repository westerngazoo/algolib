<rect width="760" height="200" rx="12" fill="#ffffff"/>
<text x="150" y="30" font-size="14" text-anchor="middle" fill="#111827" font-weight="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">antes</text>
